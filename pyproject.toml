[project]
name = "aegis"
version = "0.1.0"
description = "Agentic AI Security Mesh — MCP-aware proxy for OWASP LLM Top-10 enforcement"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name="Aditya Singh"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "rich>=13.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "anyio>=4.0",
    "ruff>=0.6",
]

[project.scripts]
aegis = "aegis.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff.lint]
# Correctness + import hygiene, enforced in CI by `ruff check .`.
# E501 (line-too-long) is intentionally NOT enabled yet: the codebase carries a
# pre-existing backlog of long lines, so enabling it today would mean a red gate or a
# repo-wide reformat. Wrapping those lines is a separate, formatting-only change.
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["aegis"]
