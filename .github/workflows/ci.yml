name: AEGIS CI Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -e ".[dev]"
      - name: Tests
        run: pytest tests/ -v --tb=short
      - name: Red-team gate
        run: python -m aegis.eval.redteam --report --fail-under 95 --max-p95-ms 200
      - name: Gate check (secondary)
        run: python scripts/gate.py --fail-under 95 --max-p95-ms 200
